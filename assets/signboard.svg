<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="sb-title">
  <title id="sb-title">PetCure Clinic signboard: Veterinary Hospital and Pet Spa. Open 7 days, 9 am to 8 pm. Emergency 24/7: 98765 43210.</title>
  <defs>
    <linearGradient id="sb-board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2D4A"/>
      <stop offset="1" stop-color="#0F1C30"/>
    </linearGradient>
    <linearGradient id="sb-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8CF95"/>
      <stop offset=".5" stop-color="#C9A45C"/>
      <stop offset="1" stop-color="#A9843F"/>
    </linearGradient>
    <g id="sb-paw">
      <circle cx="-9" cy="-6" r="3.6"/><circle cx="0" cy="-10" r="3.6"/><circle cx="9" cy="-6" r="3.6"/>
      <path d="M0-2c-5 0-8.5 3.6-8.5 7.2 0 2.4 2.4 3.6 4.8 3.6 1.6 0 2.4-.7 3.7-.7s2.1.7 3.7.7c2.4 0 4.8-1.2 4.8-3.6C8.5 1.6 5-2 0-2z"/>
    </g>
  </defs>

  <!-- Board -->
  <rect x="6" y="6" width="1188" height="408" rx="28" fill="url(#sb-board)"/>
  <rect x="22" y="22" width="1156" height="376" rx="18" fill="none" stroke="url(#sb-gold)" stroke-width="3"/>
  <rect x="32" y="32" width="1136" height="356" rx="12" fill="none" stroke="#C9A45C" stroke-opacity=".35" stroke-width="1"/>

  <!-- Logo medallion -->
  <circle cx="190" cy="178" r="104" fill="url(#sb-gold)"/>
  <circle cx="190" cy="178" r="92" fill="#14233B"/>
  <circle cx="190" cy="178" r="84" fill="none" stroke="#C9A45C" stroke-opacity=".6" stroke-width="1.5"/>
  <g fill="#fff" transform="translate(190 182) scale(4.2)"><use href="#sb-paw"/></g>
  <!-- Medical cross accent -->
  <g transform="translate(248 116)">
    <circle r="20" fill="#C9A45C"/>
    <path d="M-4-11h8v7h7v8h-7v7h-8v-7h-7v-8h7z" fill="#14233B"/>
  </g>

  <!-- Name -->
  <text x="340" y="176" fill="#FFFFFF" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="104" letter-spacing="1">PetCure Clinic</text>
  <!-- Tagline with rules -->
  <line x1="344" y1="216" x2="384" y2="216" stroke="#C9A45C" stroke-width="2"/>
  <text x="398" y="225" fill="#E3C98B" font-family="'DM Sans', Arial, sans-serif" font-weight="700" font-size="26" letter-spacing="6">VETERINARY HOSPITAL &amp; PET SPA</text>

  <!-- Paw trail -->
  <g fill="#C9A45C" fill-opacity=".55">
    <g transform="translate(1112 172) rotate(20) scale(1.1)"><use href="#sb-paw"/></g>
    <g transform="translate(1138 118) rotate(20) scale(1)"><use href="#sb-paw"/></g>
    <g transform="translate(1114 68) rotate(20) scale(.85)" fill-opacity=".7"><use href="#sb-paw"/></g>
  </g>

  <!-- Info strip -->
  <rect x="32" y="300" width="1136" height="88" rx="0" fill="#0B1626" fill-opacity=".55"/>
  <line x1="32" y1="300" x2="1168" y2="300" stroke="#C9A45C" stroke-opacity=".5" stroke-width="1.5"/>
  <text x="80" y="356" fill="#F4EAD3" font-family="'DM Sans', Arial, sans-serif" font-weight="500" font-size="28">Open 7 days  ·  9 am – 8 pm</text>
  <text x="80" y="356" dx="420" fill="#F4EAD3" font-family="'DM Sans', Arial, sans-serif" font-weight="500" font-size="28">Dogs · Cats · Birds · Rabbits</text>
  <rect x="868" y="318" width="276" height="54" rx="27" fill="url(#sb-gold)"/>
  <text x="1006" y="353" text-anchor="middle" fill="#14233B" font-family="'DM Sans', Arial, sans-serif" font-weight="700" font-size="24">24/7 · 98765 43210</text>
</svg>
